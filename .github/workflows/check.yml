name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: index.json matches the sources
        run: python3 scripts/build.py --check
      - name: tests
        run: python3 -m unittest discover -s tests -q
